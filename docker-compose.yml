version: '3.8'

services:
  # ========== RocketMQ 相关服务 ==========
  namesrv:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    networks:
      - rocketmq-net

  broker:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: "namesrv:9876"
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    volumes:
      # 官方镜像不保证读环境变量 BROKER_IP1，用 conf 写死公网 IP
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/broker.conf:ro
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/rocketmq-5.5.0/conf/broker.conf
    depends_on:
      - namesrv
    networks:
      - rocketmq-net

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: rocketmq-dashboard
    ports:
      - "8082:8082"
    environment:
      NAMESRV_ADDR: "namesrv:9876"
    depends_on:
      - namesrv
    networks:
      - rocketmq-net

  # ========== MySQL 服务 ==========
  mysql:
    image: mysql:8.0
    container_name: mes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Fzy20041126
      MYSQL_DATABASE: mes_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mes-mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/sql/mes_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pFzy20041126"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rocketmq-net

  # ========== Redis 服务 ==========
  redis:
    image: redis:7-alpine
    container_name: mes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - rocketmq-net

  # ========== MES 后端（可选：本地开发可不用，直接 mvn spring-boot:run）==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mes-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Fzy20041126
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MES_ROCKETMQ_NAME_SERVER: namesrv:9876
      MES_ROCKETMQ_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      namesrv:
        condition: service_started
      broker:
        condition: service_started
    networks:
      - rocketmq-net

  # ========== 新增 Modbus 模拟器服务 ==========
  modbus-sim:
    image: allexd2010/modbus-server-sim:2.2.0   # 轻量级 Modbus TCP 模拟器
    container_name: modbus-simulator
    restart: unless-stopped
    ports:
      - "502:502"   # 将容器内的 502 端口映射到宿主机 502，MES 通过公网IP:502 访问
    environment:
      # 可选的初始数据配置（示例：设置保持寄存器的初始值，格式为 地址:值,地址:值...）
      # 若不需要，可以删除此环境变量
      - INIT_HR_VALUES=0:100,1:200,2:50,3:300
    networks:
      - rocketmq-net

# ========== 持久化卷 ==========
volumes:
  mes-mysql-data:   # MySQL 数据卷

# ========== 网络 ==========
networks:
  rocketmq-net:
    driver: bridge
